  <!-- Script del Typewriter con el nuevo timing corregido (holdTime: 3000ms para lectura cómoda) -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const words = ['Justo', 'Innovador', 'Seguro', 'Transparente', 'Unido', 'Próspero'];
      const targetElement = document.getElementById('typewriter-word');

      if (targetElement) {
        let wordIndex = 0;
        let charIndex = 0;
        let isDeleting = false;

        const typeSpeed = 100;
        const deleteSpeed = 60;
        const holdTime = 3000; // 3 segundos exactos de pausa para que el ojo pueda leerlo perfectamente

        function typeEffect() {
          const currentWord = words[wordIndex];

          if (isDeleting) {
            targetElement.textContent = currentWord.substring(0, charIndex - 1);
            charIndex--;
          } else {
            targetElement.textContent = currentWord.substring(0, charIndex + 1);
            charIndex++;
          }

          let currentSpeed = isDeleting ? deleteSpeed : typeSpeed;

          if (!isDeleting && charIndex === currentWord.length) {
            currentSpeed = holdTime;
            isDeleting = true;
          } else if (isDeleting && charIndex === 0) {
            isDeleting = false;
            wordIndex = (wordIndex + 1) % words.length;
            currentSpeed = 300;
          }

          setTimeout(typeEffect, currentSpeed);
        }

        typeEffect();
      }
    });
  </script>
